[pytest]
markers =
    gemini_live: calls the real Gemini API; OPT-IN: skipped unless INOEMA_ALLOW_LIVE_GEMINI=1 AND GEMINI_API_KEY is set (run: INOEMA_ALLOW_LIVE_GEMINI=1 pytest tests/integration -m gemini_live)
    paypal_live: calls the real PayPal Sandbox; OPT-IN: skipped unless INOEMA_ALLOW_LIVE_PAYPAL=1 AND PAYPAL_CLIENT_ID/SECRET are set (run: INOEMA_ALLOW_LIVE_PAYPAL=1 pytest tests/integration -m paypal_live)
